name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Check Gemini key
        continue-on-error: true
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          curl -sS -w '\nHTTP %{http_code} in %{time_total}s\n' -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
            -d '{"system_instruction":{"parts":[{"text":"Translate from Spanish to English. Reply with only the translation."}]},"contents":[{"parts":[{"text":"Hola como te llamas me llamo Juan"}]}],"generationConfig":{"thinkingConfig":{"thinkingLevel":"low"}}}' \
            https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
      - name: Restore signing key
        env: { KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: echo "$KEYSTORE_BASE64" | base64 -di > "$RUNNER_TEMP/release.p12"
      - run: gradle assembleRelease --stacktrace
        env:
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          KEYSTORE_FILE: "${{ runner.temp }}/release.p12"
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
      - name: Show APK signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with: { name: DuoTranslate-apk, path: app/build/outputs/apk/release/*.apk }
