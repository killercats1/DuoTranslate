name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Check Gemini key
        continue-on-error: true
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          for m in gemini-3.5-flash gemini-3.8-flash; do
            echo "== $m"
            curl -sS -w '\nHTTP %{http_code}\n' -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
              -d '{"system_instruction":{"parts":[{"text":"Translate from Spanish to English. Reply with only the translation."}]},"contents":[{"parts":[{"text":"Hola como te llamas me llamo Juan"}]}]}' \
              https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent
          done
      - run: gradle assembleDebug --stacktrace
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
      - uses: actions/upload-artifact@v4
        with: { name: DuoTranslate-apk, path: app/build/outputs/apk/debug/app-debug.apk }
